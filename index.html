<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#11120f" />

    <title>RYLIX — DJ et producteur, Valais</title>
    <meta
      name="description"
      content="RYLIX est un DJ et producteur suisse originaire du Valais. Better Days, son premier single, est disponible."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Syne self-hostée, préchargée pour éviter le FOUT sur le hero -->
    <link
      rel="preload"
      href="/fonts/syne-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />

    <!-- L'embed Spotify n'est chargé que sur /musique -->
    <link rel="dns-prefetch" href="https://open.spotify.com" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: sans-serif; color: #f2f0e8">
        <h1>RYLIX</h1>
        <p>DJ et producteur.</p>
        <p>
          Better Days est disponible sur
          <a style="color: #d9ff43" href="https://open.spotify.com/artist/7J5z5bTji0fyEE3X0xhI3k"
            >Spotify</a
          >.
        </p>
        <p>Ce site nécessite JavaScript pour la navigation.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
